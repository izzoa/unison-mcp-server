services:
  unison-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: unison-mcp-server:latest
    container_name: unison-mcp-server
    
    # Container labels for traceability
    labels:
      - "com.unison-mcp.service=unison-mcp-server"
      - "com.unison-mcp.version=1.0.0"
      - "com.unison-mcp.environment=production"
      - "com.unison-mcp.description=AI-powered Model Context Protocol server"
    
    # Environment variables
    environment:
      # Default model configuration
      - DEFAULT_MODEL=${DEFAULT_MODEL:-auto}
      
      # API Keys (use Docker secrets in production)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - XAI_API_KEY=${XAI_API_KEY}
      - DIAL_API_KEY=${DIAL_API_KEY}
      - DIAL_API_HOST=${DIAL_API_HOST}
      - DIAL_API_VERSION=${DIAL_API_VERSION}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - CUSTOM_API_URL=${CUSTOM_API_URL}
      - CUSTOM_API_KEY=${CUSTOM_API_KEY}
      - CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME}
      
      # Logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Advanced configuration
      - DEFAULT_THINKING_MODE_THINKDEEP=${DEFAULT_THINKING_MODE_THINKDEEP:-high}
      - DISABLED_TOOLS=${DISABLED_TOOLS}
      - MAX_MCP_OUTPUT_TOKENS=${MAX_MCP_OUTPUT_TOKENS}
      
      # Conversation memory (code defaults: 3 hours, 50 turns, when unset)
      # A bare "- NAME" forwards the variable only when it is set in your shell or .env;
      # when it is unset the container does not define it, so the code default applies.
      - CONVERSATION_TIMEOUT_HOURS
      - MAX_CONVERSATION_TURNS

      # Conversation storage (STORAGE_BACKEND=sqlite writes to the unison-mcp-data volume)
      - STORAGE_BACKEND
      - STORAGE_SQLITE_PATH
      - STORAGE_SWEEP_INTERVAL_SECONDS

      # Batch execution (execution_mode="batch"; needs OPENROUTER_API_KEY).
      # The store lives on the unison-mcp-data volume so batch handles survive restarts.
      - BATCH_STORE_PATH=${BATCH_STORE_PATH:-/app/.unison/batches.db}
      - BATCH_RETENTION_DAYS
      - OPENROUTER_BATCH_LIVE_CATALOG
      - OPENROUTER_BATCH_CATALOG_TTL_SECONDS

      # clink (spawns CLIs installed inside the container; none ship in the image)
      - CLINK_TIMEOUT_SECONDS
      - CLINK_EXECUTION_MODE
      - CLINK_SNAPSHOT_BUDGET_SECONDS
      - CLINK_DEFAULT_WORKING_DIR
      - CLINK_WORKING_DIR_FALLBACK
      - CLINK_MCP_ROOTS
      - CLINK_OPENCODE_MODE

      # Circuit breaker
      - CIRCUIT_FAILURE_THRESHOLD
      - CIRCUIT_RESET_TIMEOUT_SECONDS
      - CIRCUIT_HALF_OPEN_MAX_CALLS

      # Server configuration
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - TZ=${TZ:-UTC}
    
    # Volumes for persistent data
    volumes:
      - ./logs:/app/logs
      - unison-mcp-config:/app/conf
      # Writable data directory (batch store, SQLite conversation storage). The container
      # root filesystem is read-only, so these need a mounted volume.
      - unison-mcp-data:/app/.unison
      - /etc/localtime:/etc/localtime:ro
    
    # Network configuration
    networks:
      - unison-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart policy
    restart: unless-stopped
    
    # Security
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
      - /app/tmp:noexec,nosuid,size=50m

# Named volumes
volumes:
  unison-mcp-config:
    driver: local
  unison-mcp-data:
    driver: local

# Networks
networks:
  unison-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
