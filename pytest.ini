[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = 
    -v
    --strict-markers
    --tb=short
markers =
    integration: tests that need an external service, a real CLI, Docker, recorded cassettes or a local Ollama model (excluded from code_quality_checks.sh)